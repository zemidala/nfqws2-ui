name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check scripts
        run: |
          sh -n src/bin/nfqws-ui-setup
          sh -n install.sh
          sh -n packaging/openwrt/postinst packaging/openwrt/prerm packaging/openwrt/postrm
          php -l src/www/api.php
          node --check src/www/app.js

      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"

      - name: Build
        run: sh scripts/build.sh "$(cat VERSION)"

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v="$(cat VERSION)"
          awk -v v="$v" '$0 ~ "^## "v" " {p=1; next} /^## / {p=0} p' CHANGELOG.md > notes.md
          cat >> notes.md <<EOT

          ## Установка

          На роутере с OpenWrt 24.10 и установленным nfqws2-keenetic:

          \`\`\`sh
          wget -qO- https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/install.sh | sh
          \`\`\`

          Перед установкой прочитайте [ограничения и предупреждения](https://github.com/${GITHUB_REPOSITORY}#ограничения-и-предупреждения).
          EOT

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "nfqws2-ui $GITHUB_REF_NAME" --notes-file notes.md --verify-tag \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
