<script>
  // Оформление и компоновка применяются до отрисовки, чтобы не мелькал другой вид
  // Z is the K layout with the brand palette (data-variant="k" + data-palette="zd"); a new install's default is cached
  try { var l = JSON.parse(localStorage.getItem('nfqws-ui-look') || '{}'), d = document.documentElement.dataset, v = l.variant || (localStorage.getItem('nfqws-ui-look-default') === 'z' ? 'z' : ''); if (v === 'z') { d.variant = 'k'; d.palette = 'zd'; } else if (v) d.variant = v; if (l.mode) document.documentElement.dataset.mode = l.mode; if (l.layout) document.documentElement.dataset.layout = l.layout; var t = localStorage.getItem('nfqws-ui-scheme-css'); if (t) { var s = document.createElement('style'); s.id = 'scheme-style'; s.textContent = t; document.head.appendChild(s); } } catch (e) {}
</script>

<body>
<div id="app"><div class="boot">Загрузка…</div></div>
<div id="toasts" aria-live="polite"></div>
<script>
  // If the interface has not started in 10 s, say so instead of an endless «Загрузка…»: the error (if any) and a reload
  (function () {
    var err = '';
    window.addEventListener('error', function (e) { if (!err) err = (e.message || 'ошибка') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''); });
    setTimeout(function () {
      var b = document.querySelector('#app > .boot');
      if (!b) return;
      b.innerHTML = '';
      var p = document.createElement('p'); p.textContent = 'Интерфейс не запустился за 10 секунд.' + (err ? ' Ошибка: ' + err : ' Возможно, файлы не догрузились.');
      var a = document.createElement('button'); a.type = 'button'; a.className = 'btn primary'; a.textContent = 'Перезагрузить';
      a.onclick = function () { location.reload(); };
      b.appendChild(p); b.appendChild(a);
    }, 10000);
  })();
</script>
